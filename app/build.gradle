plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'io.github.gkdhide.gkdx'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.gkdhide.gkdx'
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName '2.0.1'
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
    }
}

// ---------------- 守护进程 dex 构建链 ----------------
def daemonClasses = file("$buildDir/daemonClasses")
def daemonDexDir = file("$buildDir/daemonDex")
android.sourceSets["main"].assets.srcDir("$buildDir/daemonAssets")

tasks.register("compileDaemon", JavaCompile) {
    source = fileTree("src/main/daemon")
    destinationDirectory.set(daemonClasses)
    classpath = files("${android.sdkDirectory}/platforms/android-${android.compileSdk}/android.jar")
    sourceCompatibility = "1.8"
    targetCompatibility = "1.8"
}
tasks.register("jarDaemon", Jar) {
    dependsOn("compileDaemon")
    from(daemonClasses)
    archiveFileName.set("gkdx_daemon.jar")
    destinationDirectory.set(file("$buildDir/daemonJar"))
}
tasks.register("dexDaemon", Exec) {
    dependsOn("jarDaemon")
    doFirst { daemonDexDir.mkdirs() }
    def bt = "${android.sdkDirectory}/build-tools/34.0.0"
    def d8 = org.gradle.internal.os.OperatingSystem.current().isWindows() ? file("$bt/d8.bat") : file("$bt/d8")
    commandLine(d8, "--release", "--min-api", "26", "--output", daemonDexDir.absolutePath,
                file("$buildDir/daemonJar/gkdx_daemon.jar").absolutePath)
}
tasks.register("copyDaemonDex", Copy) {
    dependsOn("dexDaemon")
    from(daemonDexDir) {
        include("classes.dex")
        rename("classes.dex", "gkdx_daemon.dex")
    }
    into("$buildDir/daemonAssets")
}
tasks.named("preBuild") { dependsOn("copyDaemonDex") }

dependencies {
    // Xposed API 仅编译期使用，运行时由 LSPosed 宿主提供
    compileOnly 'de.robv.android.xposed:api:82'
    // GKD 订阅 JSON5 解析
    implementation 'li.songe:json5:0.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    // GKD 官方选择器引擎（内嵌源码）
    implementation project(':gkd-selector')

    // UI：与 GKD 一致的 Compose Material3
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.2'
}
